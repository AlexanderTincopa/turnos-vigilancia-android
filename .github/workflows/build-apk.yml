name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project archive
        run: |
          cat project.b64.* | base64 -d > project.zip
          unzip -q project.zip

      - name: Apply MVP v6 navigation and branding
        run: python .github/scripts/apply_v6.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: TurnosVigilancia
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TurnosVigilancia-debug-apk
          path: TurnosVigilancia/app/build/outputs/apk/debug/app-debug.apk
