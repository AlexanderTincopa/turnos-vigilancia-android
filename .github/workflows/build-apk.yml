name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode project archive
        run: |
          base64 -d project.b64 > project.zip
          unzip -t project.zip
          unzip -o project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: TurnosVigilancia
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TurnosVigilancia-debug-apk
          path: TurnosVigilancia/app/build/outputs/apk/debug/app-debug.apk
