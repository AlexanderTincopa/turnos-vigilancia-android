name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild stable base project
        run: |
          git fetch origin f928e0d66db441ad4028cef7b16fddfde5b9e74a --depth=1
          for i in 00 01 02 03 04 05 06; do
            git show f928e0d66db441ad4028cef7b16fddfde5b9e74a:project.b64.$i
          done | base64 -d > project.zip
          unzip -q project.zip

      - name: Apply MVP v5 UI
        run: |
          base64 -d .github/overrides/App.kt.gz.b64 | gzip -d > TurnosVigilancia/app/src/main/java/com/alexandertm/turnosvigilancia/ui/App.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: TurnosVigilancia
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TurnosVigilancia-debug-apk
          path: TurnosVigilancia/app/build/outputs/apk/debug/app-debug.apk
